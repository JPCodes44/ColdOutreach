<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc">
<title id="title">ColdOutreach architecture</title><desc id="desc">The React frontend uses authenticated Convex functions. The backend uses shared email utilities and server-side integrations for research, generation, contacts, and delivery. Credentials remain server-side.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168678"/></marker></defs>
<rect width="960" height="432" rx="24" fill="#f3f6fa"/>
<g font-family="DejaVu Sans, sans-serif"><text x="32" y="42" font-size="13" fill="#168678" font-weight="700">TYPESCRIPT · BUN WORKSPACE</text><text x="32" y="82" font-size="30" fill="#17253c" font-weight="700">How the pieces fit</text><rect x="32" y="114" width="280" height="148" rx="16" fill="#ffffff" stroke="#dce3ec"/><text x="52" y="149" font-size="14" fill="#168678" font-weight="700">frontend/</text><text x="52" y="185" font-size="23" fill="#17253c" font-weight="700">React + Vite</text><text x="52" y="217" font-size="14" fill="#526078" font-weight="400">Signed-in workspace</text><text x="52" y="241" font-size="14" fill="#526078" font-weight="400">Companies, drafts, recipients</text><rect x="340" y="114" width="280" height="148" rx="16" fill="#ffffff" stroke="#dce3ec"/><text x="360" y="149" font-size="14" fill="#168678" font-weight="700">backend/</text><text x="360" y="185" font-size="23" fill="#17253c" font-weight="700">Convex</text><text x="360" y="217" font-size="14" fill="#526078" font-weight="400">Research + drafting pipeline</text><text x="360" y="241" font-size="14" fill="#526078" font-weight="400">Queue, delivery, sent history</text><rect x="648" y="114" width="280" height="148" rx="16" fill="#ffffff" stroke="#dce3ec"/><text x="668" y="149" font-size="14" fill="#168678" font-weight="700">common/</text><text x="668" y="185" font-size="23" fill="#17253c" font-weight="700">Shared utilities</text><text x="668" y="217" font-size="14" fill="#526078" font-weight="400">Email content types</text><text x="668" y="241" font-size="14" fill="#526078" font-weight="400">Safe HTML + text rendering</text><path d="M313 185 L337 185" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><path d="M645 185 L621 185" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 263 L480 298" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="306" width="896" height="100" rx="12" fill="#17253c" stroke="#17253c"/><text x="52" y="339" font-size="19" fill="#ffffff" font-weight="700">Server integrations</text><text x="52" y="369" font-size="17" fill="#d6e7f1" font-weight="400">Gemini · OpenAI · Gmail · Apollo · optional Firecrawl</text><text x="52" y="391" font-size="14" fill="#d6e7f1" font-weight="400">Credentials stay in Convex. The browser receives only the public deployment URL.</text></g></svg>
