<svg xmlns="http://www.w3.org/2000/svg" width="960" height="438" viewBox="0 0 960 438" role="img" aria-labelledby="title desc">
<title id="title">Two drafting modes</title><desc id="desc">Website review defaults off. Research-only emails are letters from saved facts. Optional website review uses cited evidence and an illustrative dashboard. Review is optional; scheduling stores an immutable snapshot.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168678"/></marker></defs>
<rect width="960" height="438" rx="24" fill="#f3f6fa"/>
<g font-family="DejaVu Sans, sans-serif"><text x="32" y="42" font-size="13" fill="#168678" font-weight="700">CHOOSE HOW MUCH RESEARCH GOES INTO THE EMAIL</text><text x="32" y="82" font-size="30" fill="#17253c" font-weight="700">Two ways to draft</text><rect x="32" y="112" width="436" height="184" rx="16" fill="#ffffff" stroke="#dce3ec"/><text x="52" y="146" font-size="12" fill="#168678" font-weight="700">DEFAULT</text><text x="52" y="180" font-size="24" fill="#17253c" font-weight="700">Company research</text><text x="52" y="214" font-size="15" fill="#526078" font-weight="400">Saved company facts + your instructions</text><text x="52" y="241" font-size="15" fill="#526078" font-weight="400">→ Letter, closing question, signature</text><text x="52" y="268" font-size="15" fill="#526078" font-weight="400">→ No website findings or dashboards</text><rect x="492" y="112" width="436" height="184" rx="16" fill="#ffffff" stroke="#dce3ec"/><text x="512" y="146" font-size="12" fill="#168678" font-weight="700">OPTIONAL</text><text x="512" y="180" font-size="24" fill="#17253c" font-weight="700">Website review</text><text x="512" y="214" font-size="15" fill="#526078" font-weight="400">Public website pages → cited evidence</text><text x="512" y="241" font-size="15" fill="#526078" font-weight="400">→ Observation, opportunity, proposed solution</text><text x="512" y="268" font-size="15" fill="#526078" font-weight="400">→ Illustrative dashboard + closing question</text><path d="M250 297 L250 327" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 297 L710 327" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="332" width="896" height="80" rx="12" fill="#e0f2ee" stroke="#c9e6df"/><text x="52" y="364" font-size="21" fill="#116b60" font-weight="700">Saved draft → optional view / edit → schedule</text><text x="52" y="392" font-size="15" fill="#116b60" font-weight="400">Scheduling freezes the saved content. Later edits do not change queued emails.</text></g></svg>
