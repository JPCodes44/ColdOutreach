<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" aria-labelledby="title desc">
<title id="title">ColdOutreach workflow</title><desc id="desc">Set sender settings, discover companies, generate drafts, add recipients, then schedule through Gmail and track history. Review and editing are optional; generation never sends email.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168678"/></marker></defs>
<rect width="960" height="434" rx="24" fill="#f3f6fa"/>
<g font-family="DejaVu Sans, sans-serif"><text x="32" y="42" font-size="13" fill="#168678" font-weight="700">FROM COMPANY RESEARCH TO A REAL CONVERSATION</text><text x="32" y="82" font-size="30" fill="#17253c" font-weight="700">Your outreach, in four steps</text><rect x="32" y="115" width="212" height="218" rx="16" fill="#ffffff" stroke="#dce3ec"/><rect x="48" y="131" width="40" height="32" rx="9" fill="#e0f2ee" stroke="#e0f2ee"/><text x="56" y="153" font-size="15" fill="#116b60" font-weight="700">01</text><text x="48" y="196" font-size="22" fill="#17253c" font-weight="700">Discover</text><text x="48" y="229" font-size="14" fill="#526078" font-weight="400">Find companies that</text><text x="48" y="253" font-size="14" fill="#526078" font-weight="400">fit your niche.</text><text x="48" y="308" font-size="13" fill="#168678" font-weight="700">Companies</text><path d="M245 219 L258 219" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="115" width="212" height="218" rx="16" fill="#ffffff" stroke="#dce3ec"/><rect x="276" y="131" width="40" height="32" rx="9" fill="#e0f2ee" stroke="#e0f2ee"/><text x="284" y="153" font-size="15" fill="#116b60" font-weight="700">02</text><text x="276" y="196" font-size="22" fill="#17253c" font-weight="700">Draft</text><text x="276" y="229" font-size="14" fill="#526078" font-weight="400">Use saved research;</text><text x="276" y="253" font-size="14" fill="#526078" font-weight="400">optionally review the site.</text><text x="276" y="308" font-size="13" fill="#168678" font-weight="700">Pipeline · Review</text><path d="M473 219 L486 219" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="115" width="212" height="218" rx="16" fill="#ffffff" stroke="#dce3ec"/><rect x="504" y="131" width="40" height="32" rx="9" fill="#e0f2ee" stroke="#e0f2ee"/><text x="512" y="153" font-size="15" fill="#116b60" font-weight="700">03</text><text x="504" y="196" font-size="22" fill="#17253c" font-weight="700">Add recipients</text><text x="504" y="229" font-size="14" fill="#526078" font-weight="400">Keep existing contacts;</text><text x="504" y="253" font-size="14" fill="#526078" font-weight="400">fill verified work emails.</text><text x="504" y="308" font-size="13" fill="#168678" font-weight="700">Recipients</text><path d="M701 219 L714 219" fill="none" stroke="#168678" stroke-width="2" marker-end="url(#arrow)"/><rect x="716" y="115" width="212" height="218" rx="16" fill="#ffffff" stroke="#dce3ec"/><rect x="732" y="131" width="40" height="32" rx="9" fill="#e0f2ee" stroke="#e0f2ee"/><text x="740" y="153" font-size="15" fill="#116b60" font-weight="700">04</text><text x="732" y="196" font-size="22" fill="#17253c" font-weight="700">Send</text><text x="732" y="229" font-size="14" fill="#526078" font-weight="400">Schedule through Gmail.</text><text x="732" y="253" font-size="14" fill="#526078" font-weight="400">Track sends and replies.</text><text x="732" y="308" font-size="13" fill="#168678" font-weight="700">Send · History</text><rect x="32" y="355" width="896" height="53" rx="12" fill="#17253c" stroke="#17253c"/><text x="53" y="388" font-size="17" fill="#ffffff" font-weight="400">Set your offer + signature in Settings first. Generating a draft never sends it.</text></g></svg>
